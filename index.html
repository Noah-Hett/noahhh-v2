<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e0dcdc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#262626" />
    <!-- Default title; each page renders its own <title> (React 19 hoists it). -->
    <title>Noah Hett</title>
    <!-- TODO(copy): stand-in from the hero line until the final description lands.
         Keep og:description and twitter:description in sync with it. -->
    <meta name="description" content="Noah Hett is a design engineer in London, obsessed with visual comms and tangible interfaces that make complex systems legible." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (crawlers don't run JS, so these are site-wide).
         Absolute URLs: share cards resolve against the live domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noah Hett" />
    <meta property="og:title" content="Noah Hett" />
    <meta property="og:description" content="Noah Hett is a design engineer in London, obsessed with visual comms and tangible interfaces that make complex systems legible." />
    <meta property="og:url" content="https://noahhh.com/" />
    <meta property="og:image" content="https://noahhh.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Noah Hett, design engineer, London — portrait over a line drawing" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noah Hett" />
    <meta name="twitter:description" content="Noah Hett is a design engineer in London, obsessed with visual comms and tangible interfaces that make complex systems legible." />
    <meta name="twitter:image" content="https://noahhh.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
